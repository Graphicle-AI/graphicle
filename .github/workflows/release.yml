# Release of Graphicle Core. A version tag (v0.1.0, or v0.1.0-rc.1 for a
# prerelease) builds graphicle and graphicle-graph on a native runner per
# target, packages each target as graphicle-<version>-<target>.tar.gz (both
# programs, LICENSE, NOTICE, README.md, CHANGELOG.md and the third-party
# licence texts; a .zip for Windows) with packaging/release_build.py, has the
# Windows programs signed through SignPath, writes SHA256SUMS and the Homebrew
# formula, and publishes a GitHub release with the archives, their .sha256
# files, SHA256SUMS, install.sh, install.ps1 and graphicle.rb. A final
# (non-prerelease) tag also updates graphicle-ai/homebrew-tap.
# The signing and the tap update run in the GitHub environments signpath and
# homebrew. Each one accepts only v* tags, waits for its required reviewer and
# holds its own secret, which no other job or workflow can read.
# Run by hand (workflow_dispatch), it builds and packages without signing or
# releasing.
name: release

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  RUST_TOOLCHAIN: "1.95.0"

jobs:
  build:
    name: build (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS images: macos-13 is retired and macos-14 is unsupported from
          # 2 November 2026 (actions/runner-images#13518); macos-15-intel is
          # the remaining x86-64 image.
          - target: aarch64-apple-darwin
            runner: macos-15
          - target: x86_64-apple-darwin
            runner: macos-15-intel
          # Built on Ubuntu 22.04 so that the programs need glibc 2.35, not
          # the 2.39 of ubuntu-latest: they then also run on Debian 12 and
          # Ubuntu 22.04. GitHub retires these images on 17 April 2027
          # (actions/runner-images#14254); move to a glibc 2.35 container or
          # toolchain before then.
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-22.04
            max_glibc: "2.35"
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-22.04-arm
            max_glibc: "2.35"
          # Windows (preview). The programs link the C runtime statically, so
          # a clean Windows without the Visual C++ runtime runs them;
          # release_build.py checks their imports. RUSTFLAGS, not
          # .cargo/config.toml: release_build.py passes the flags through
          # CARGO_ENCODED_RUSTFLAGS, which makes Cargo ignore config rustflags.
          - target: x86_64-pc-windows-msvc
            runner: windows-2022
            rustflags: -C target-feature=+crt-static
            python: python
    env:
      # The oldest macOS the programs support.
      MACOSX_DEPLOYMENT_TARGET: "11.0"
    # Git Bash on Windows, so that every target runs the same scripts.
    defaults:
      run:
        shell: bash
    steps:
      # Windows: long paths for deep files. Line endings need no setting: the
      # repository's .gitattributes checks text files out with LF on every
      # system, so the archives hold the same text as the tarballs.
      - name: Git settings
        if: runner.os == 'Windows'
        run: git config --global core.longpaths true
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Version
        id: version
        shell: bash
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="$(sed -n 's/^version = "\(.*\)"$/\1/p' crates/graphicle/Cargo.toml | head -n 1)"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Graphicle $version for ${{ matrix.target }}"
      - name: Toolchain
        env:
          TARGET: ${{ matrix.target }}
        run: |
          if ! command -v rustup >/dev/null; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain none
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
            export PATH="$HOME/.cargo/bin:$PATH"
          fi
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
          rustup default "$RUST_TOOLCHAIN"
          host="$(rustc -vV | sed -n 's/^host: //p')"
          if [ "$host" != "$TARGET" ]; then echo "::error::runner host $host is not $TARGET"; exit 1; fi
      # Python 3.14 unpacks the parser sources itself (compression.zstd).
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        if: runner.os == 'Windows'
        with:
          python-version: "3.14"
      - name: zstd (unpacks the parser sources)
        if: runner.os != 'Windows'
        run: |
          if ! command -v zstd >/dev/null; then
            if [ "$RUNNER_OS" = macOS ]; then brew install zstd; else sudo apt-get update && sudo apt-get install -y zstd; fi
          fi
      - name: Prepare parser sources
        run: ${{ matrix.python || 'python3' }} crates/graphicle/tools/prepare_parser_sources.py
      - name: Build and package
        env:
          VERSION: ${{ steps.version.outputs.version }}
          MAX_GLIBC: ${{ matrix.max_glibc }}
          RUSTFLAGS: ${{ matrix.rustflags }}
        run: >-
          ${{ matrix.python || 'python3' }} packaging/release_build.py --out dist --expect-version "$VERSION"
          --require-licenses ${MAX_GLIBC:+--max-glibc "$MAX_GLIBC"}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist-${{ matrix.target }}
          path: dist/
          if-no-files-found: error
          overwrite: true

  sign-windows:
    # Code signing of graphicle.exe and graphicle-graph.exe through SignPath
    # (docs/code-signing.md), for tags only. The job runs in the signpath
    # environment: it starts once the approver approves it, and only it can
    # read that environment's SIGNPATH_API_TOKEN secret. The repository
    # variables name the SignPath organization, project, signing policy and
    # artifact configuration; the configuration signs the two programs in the
    # top folder of the archive that this job uploads as windows-unsigned. The
    # signed archive must hold the same files as the unsigned one, with only
    # the two programs changed. It then goes to the release job with its new
    # .sha256 as the windows-signed artifact, and signed=true. Signing never
    # stops the release: when this job fails, times out or is rejected, the
    # release ships the unsigned archive and its notes say so.
    needs: build
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    environment: signpath
    timeout-minutes: 45
    continue-on-error: true
    permissions:
      # The SignPath action reads this run's jobs and downloads its artifact.
      actions: read
      contents: read
    outputs:
      signed: ${{ steps.done.outputs.signed }}
    steps:
      - name: Token
        env:
          SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
        run: |
          if [ -z "$SIGNPATH_API_TOKEN" ]; then
            echo "::error::the signpath environment has no SIGNPATH_API_TOKEN secret"; exit 1
          fi
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist-x86_64-pc-windows-msvc
          path: dist
      - name: Upload the unsigned archive
        id: unsigned
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-unsigned
          path: dist/graphicle-*-x86_64-pc-windows-msvc.zip
          if-no-files-found: error
          overwrite: true
      - name: Sign with SignPath
        uses: signpath/github-action-submit-signing-request@f6d04783b4569d051e0c80105fe66e82819d0092 # v3.0
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_POLICY_SLUG }}
          artifact-configuration-slug: ${{ vars.SIGNPATH_ARTIFACT_CONFIGURATION_SLUG }}
          github-artifact-id: ${{ steps.unsigned.outputs.artifact-id }}
          wait-for-completion: true
          # A request that SignPath has not completed in 30 minutes fails the
          # job, and the release goes ahead unsigned.
          wait-for-completion-timeout-in-seconds: 1800
          output-artifact-directory: signed
      - name: Check the signed archive
        run: |
          set -- dist/graphicle-*-x86_64-pc-windows-msvc.zip
          name="${1##*/}"
          folder="${name%.zip}"
          test -f "signed/$name" || { echo "::error::SignPath returned no $name"; exit 1; }
          # The same file list as the unsigned archive,
          diff <(unzip -Z1 "dist/$name" | grep -v '/$' | sort) <(unzip -Z1 "signed/$name" | grep -v '/$' | sort)
          # the same contents but for the two programs,
          unzip -q "dist/$name" -d check-unsigned
          unzip -q "signed/$name" -d check-signed
          diff -r --exclude=graphicle.exe --exclude=graphicle-graph.exe check-unsigned check-signed
          # and the two programs changed by their signatures.
          for program in graphicle.exe graphicle-graph.exe; do
            if cmp -s "check-unsigned/$folder/$program" "check-signed/$folder/$program"; then
              echo "::error::SignPath returned $program unchanged"; exit 1
            fi
          done
          mkdir windows-signed
          mv "signed/$name" "windows-signed/$name"
          cd windows-signed && sha256sum "$name" > "$name.sha256" && cat "$name.sha256"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-signed
          path: windows-signed/
          if-no-files-found: error
          overwrite: true
      - name: Done
        id: done
        run: echo "signed=true" >> "$GITHUB_OUTPUT"

  release:
    needs: [build, sign-windows]
    # Goes ahead after a successful build whatever became of the signing.
    if: ${{ !cancelled() && needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true
      - name: Download the signed Windows archive
        if: needs.sign-windows.outputs.signed == 'true'
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: windows-signed
          path: signed
      - name: Windows signing
        id: signing
        # The signed archive and its .sha256 replace the unsigned ones before
        # SHA256SUMS is written. Without them the release ships the unsigned
        # archive.
        run: |
          signed=false
          set -- signed/graphicle-*-x86_64-pc-windows-msvc.zip
          name="${1##*/}"
          if [ -f "signed/$name" ] && [ -f "dist/$name" ] && (cd signed && sha256sum --check --strict "$name.sha256"); then
            mv -f "signed/$name" "signed/$name.sha256" dist/
            signed=true
          elif [ "$GITHUB_REF_TYPE" = tag ]; then
            echo "::warning::the Windows programs are unsigned in this release (see the sign-windows job)"
          fi
          echo "signed=$signed" >> "$GITHUB_OUTPUT"
      - name: Version
        id: version
        run: |
          set -- dist/graphicle-*-aarch64-apple-darwin.tar.gz
          name="${1##*/}"
          version="${name#graphicle-}"
          version="${version%-aarch64-apple-darwin.tar.gz}"
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::the archives are version $version but the tag is $GITHUB_REF_NAME"; exit 1
          fi
          case "$version" in *-*) prerelease=true ;; *) prerelease=false ;; esac
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"
      - name: Checksums
        working-directory: dist
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          for target in aarch64-apple-darwin x86_64-apple-darwin x86_64-unknown-linux-gnu aarch64-unknown-linux-gnu; do
            test -f "graphicle-$VERSION-$target.tar.gz" || { echo "::error::no archive for $target"; exit 1; }
          done
          test -f "graphicle-$VERSION-x86_64-pc-windows-msvc.zip" || { echo "::error::no archive for x86_64-pc-windows-msvc"; exit 1; }
          sha256sum --check --strict -- *.tar.gz.sha256 *.zip.sha256
          sha256sum graphicle-*.tar.gz graphicle-*.zip > SHA256SUMS
          cat SHA256SUMS
      - name: Homebrew formula, installer and notes
        env:
          VERSION: ${{ steps.version.outputs.version }}
          PRERELEASE: ${{ steps.version.outputs.prerelease }}
          SIGNED: ${{ steps.signing.outputs.signed }}
        run: |
          python3 packaging/homebrew/fill_formula.py --version "$VERSION" --sums dist/SHA256SUMS --out dist/graphicle.rb
          cp install.sh dist/install.sh
          cp install.ps1 dist/install.ps1
          # The release notes: CHANGELOG.md's section for this version.
          awk -v version="$VERSION" '
            /^## / { if (found) exit; heading = $0; sub(/^## +\[?v?/, "", heading)
                     if (index(heading, version) == 1 && substr(heading, length(version) + 1) !~ /^[0-9A-Za-z.-]/) { found = 1; next } }
            found { print }
          ' CHANGELOG.md > "$RUNNER_TEMP/notes.md"
          if [ ! -s "$RUNNER_TEMP/notes.md" ]; then
            echo "::warning::CHANGELOG.md has no section for $VERSION"
            echo "See [CHANGELOG.md](https://github.com/$GITHUB_REPOSITORY/blob/$GITHUB_REF_NAME/CHANGELOG.md)." > "$RUNNER_TEMP/notes.md"
          fi
          # The tap is updated for final releases only, so a prerelease's notes
          # give the installer alone. The single quotes keep Markdown's
          # backticks and PowerShell's $env: as they are.
          # shellcheck disable=SC2016
          {
            printf '\n## Install\n\n```sh\n'
            if [ "$PRERELEASE" != true ]; then
              printf 'brew install graphicle-ai/tap/graphicle\n# or\n'
            fi
            printf 'curl -fsSL https://github.com/%s/releases/download/v%s/install.sh | sh -s -- --version %s\n' \
              "$GITHUB_REPOSITORY" "$VERSION" "$VERSION"
            printf '```\n\nOn Windows (x86-64, preview), in PowerShell:\n\n```powershell\n'
            printf '$env:GRAPHICLE_VERSION = '"'"'%s'"'"'; irm https://github.com/%s/releases/download/v%s/install.ps1 | iex\n' \
              "$VERSION" "$GITHUB_REPOSITORY" "$VERSION"
            printf '```\n\nEach archive'"'"'s SHA-256 sum is in SHA256SUMS and beside it in a .sha256 file.\n'
            # Worded for SignPath's test-signing policy, whose certificate
            # Windows does not trust. Reword it when the release-signing
            # policy replaces it.
            if [ "$SIGNED" = true ]; then
              printf '\ngraphicle.exe and graphicle-graph.exe in the Windows archive carry a signature from a SignPath test certificate. Windows does not trust that certificate, so it treats them as unsigned programs and may warn before it runs them. [Code signing policy](https://github.com/%s/blob/%s/docs/code-signing.md)\n' \
                "$GITHUB_REPOSITORY" "$GITHUB_REF_NAME"
            else
              printf '\nThe Windows programs, graphicle.exe and graphicle-graph.exe, are not code-signed. [Code signing policy](https://github.com/%s/blob/%s/docs/code-signing.md)\n' \
                "$GITHUB_REPOSITORY" "$GITHUB_REF_NAME"
            fi
          } >> "$RUNNER_TEMP/notes.md"
          cp "$RUNNER_TEMP/notes.md" dist/RELEASE_NOTES.md
          ls -l dist
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-${{ steps.version.outputs.version }}
          path: dist/
          if-no-files-found: error
          overwrite: true
      - name: Publish the GitHub release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          PRERELEASE: ${{ steps.version.outputs.prerelease }}
        run: |
          files="dist/graphicle-*.tar.gz dist/graphicle-*.tar.gz.sha256 dist/graphicle-*.zip dist/graphicle-*.zip.sha256"
          files="$files dist/SHA256SUMS dist/install.sh dist/install.ps1 dist/graphicle.rb"
          flags=""
          if [ "$PRERELEASE" = true ]; then flags="--prerelease"; fi
          # gh uploads the files to a draft and publishes it once all are there.
          # shellcheck disable=SC2086
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            # A re-run: replace the files, and publish a draft an earlier attempt left.
            gh release upload "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --clobber $files
            gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft=false
          else
            gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag $flags \
              --title "Graphicle $VERSION" --notes-file dist/RELEASE_NOTES.md $files
          fi

  homebrew-tap:
    # Final releases only. The job runs in the homebrew environment: it starts
    # once the approver approves it, and only it can read that environment's
    # HOMEBREW_TAP_TOKEN secret, a fine-grained token with contents read and
    # write on graphicle-ai/homebrew-tap. Without the secret, copy graphicle.rb
    # from the release to the tap's Formula/ by hand. The condition names the
    # release job's result because sign-windows may have failed.
    needs: release
    if: ${{ !cancelled() && needs.release.result == 'success' && github.ref_type == 'tag' && needs.release.outputs.prerelease == 'false' }}
    runs-on: ubuntu-latest
    environment: homebrew
    permissions:
      contents: read
    env:
      VERSION: ${{ needs.release.outputs.version }}
    steps:
      - name: Token
        id: token
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          if [ -n "$TAP_TOKEN" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::warning::the homebrew environment has no HOMEBREW_TAP_TOKEN secret: copy graphicle.rb from the v$VERSION release to graphicle-ai/homebrew-tap/Formula/graphicle.rb"
          fi
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: steps.token.outputs.present == 'true'
        with:
          name: release-${{ needs.release.outputs.version }}
          path: dist
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        if: steps.token.outputs.present == 'true'
        with:
          repository: graphicle-ai/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: tap
      - name: Update the formula
        if: steps.token.outputs.present == 'true'
        working-directory: tap
        run: |
          mkdir -p Formula
          cp ../dist/graphicle.rb Formula/graphicle.rb
          git add Formula/graphicle.rb
          if git diff --cached --quiet; then echo "The tap already has graphicle $VERSION"; exit 0; fi
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -m "graphicle $VERSION"
          git push origin HEAD
