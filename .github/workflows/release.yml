# Release of Graphicle Core. A version tag (v0.1.0, or v0.1.0-rc.1 for a
# prerelease) builds graphicle and graphicle-graph on a native runner per
# target, packages each target as graphicle-<version>-<target>.tar.gz (both
# programs, LICENSE, NOTICE, README.md, CHANGELOG.md and the third-party
# licence texts) with packaging/release_build.py, writes SHA256SUMS and the
# Homebrew formula, and publishes a GitHub release with the archives, their
# .sha256 files, SHA256SUMS, install.sh and graphicle.rb. A final
# (non-prerelease) tag also updates graphicle-ai/homebrew-tap when the
# HOMEBREW_TAP_TOKEN secret is set.
# Run by hand (workflow_dispatch), it builds and packages without releasing.
name: release

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  RUST_TOOLCHAIN: "1.95.0"

jobs:
  build:
    name: build (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: true
      matrix:
        include:
          # macOS images: macos-13 is retired and macos-14 is unsupported from
          # 2 November 2026 (actions/runner-images#13518); macos-15-intel is
          # the remaining x86-64 image.
          - target: aarch64-apple-darwin
            runner: macos-15
          - target: x86_64-apple-darwin
            runner: macos-15-intel
          # Built on Ubuntu 22.04 so that the programs need glibc 2.35, not
          # the 2.39 of ubuntu-latest: they then also run on Debian 12 and
          # Ubuntu 22.04. GitHub retires these images on 17 April 2027
          # (actions/runner-images#14254); move to a glibc 2.35 container or
          # toolchain before then.
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-22.04
            max_glibc: "2.35"
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-22.04-arm
            max_glibc: "2.35"
    env:
      # The oldest macOS the programs support.
      MACOSX_DEPLOYMENT_TARGET: "11.0"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Version
        id: version
        shell: bash
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="$(sed -n 's/^version = "\(.*\)"$/\1/p' crates/graphicle/Cargo.toml | head -n 1)"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Graphicle $version for ${{ matrix.target }}"
      - name: Toolchain
        env:
          TARGET: ${{ matrix.target }}
        run: |
          if ! command -v rustup >/dev/null; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain none
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
            export PATH="$HOME/.cargo/bin:$PATH"
          fi
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
          rustup default "$RUST_TOOLCHAIN"
          host="$(rustc -vV | sed -n 's/^host: //p')"
          if [ "$host" != "$TARGET" ]; then echo "::error::runner host $host is not $TARGET"; exit 1; fi
      - name: zstd (unpacks the parser sources)
        run: |
          if ! command -v zstd >/dev/null; then
            if [ "$RUNNER_OS" = macOS ]; then brew install zstd; else sudo apt-get update && sudo apt-get install -y zstd; fi
          fi
      - name: Prepare parser sources
        run: python3 crates/graphicle/tools/prepare_parser_sources.py
      - name: Build and package
        env:
          VERSION: ${{ steps.version.outputs.version }}
          MAX_GLIBC: ${{ matrix.max_glibc }}
        run: >-
          python3 packaging/release_build.py --out dist --expect-version "$VERSION"
          --require-licenses ${MAX_GLIBC:+--max-glibc "$MAX_GLIBC"}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist-${{ matrix.target }}
          path: dist/
          if-no-files-found: error
          overwrite: true

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true
      - name: Version
        id: version
        run: |
          set -- dist/graphicle-*-aarch64-apple-darwin.tar.gz
          name="${1##*/}"
          version="${name#graphicle-}"
          version="${version%-aarch64-apple-darwin.tar.gz}"
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::the archives are version $version but the tag is $GITHUB_REF_NAME"; exit 1
          fi
          case "$version" in *-*) prerelease=true ;; *) prerelease=false ;; esac
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"
      - name: Checksums
        working-directory: dist
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          for target in aarch64-apple-darwin x86_64-apple-darwin x86_64-unknown-linux-gnu aarch64-unknown-linux-gnu; do
            test -f "graphicle-$VERSION-$target.tar.gz" || { echo "::error::no archive for $target"; exit 1; }
          done
          sha256sum --check --strict *.tar.gz.sha256
          sha256sum graphicle-*.tar.gz > SHA256SUMS
          cat SHA256SUMS
      - name: Homebrew formula, installer and notes
        env:
          VERSION: ${{ steps.version.outputs.version }}
          PRERELEASE: ${{ steps.version.outputs.prerelease }}
        run: |
          python3 packaging/homebrew/fill_formula.py --version "$VERSION" --sums dist/SHA256SUMS --out dist/graphicle.rb
          cp install.sh dist/install.sh
          # The release notes: CHANGELOG.md's section for this version.
          awk -v version="$VERSION" '
            /^## / { if (found) exit; heading = $0; sub(/^## +\[?v?/, "", heading)
                     if (index(heading, version) == 1 && substr(heading, length(version) + 1) !~ /^[0-9A-Za-z.-]/) { found = 1; next } }
            found { print }
          ' CHANGELOG.md > "$RUNNER_TEMP/notes.md"
          if [ ! -s "$RUNNER_TEMP/notes.md" ]; then
            echo "::warning::CHANGELOG.md has no section for $VERSION"
            echo "See [CHANGELOG.md](https://github.com/$GITHUB_REPOSITORY/blob/$GITHUB_REF_NAME/CHANGELOG.md)." > "$RUNNER_TEMP/notes.md"
          fi
          # The tap is updated for final releases only, so a prerelease's notes
          # give the installer alone.
          {
            printf '\n## Install\n\n```sh\n'
            if [ "$PRERELEASE" != true ]; then
              printf 'brew install graphicle-ai/tap/graphicle\n# or\n'
            fi
            printf 'curl -fsSL https://github.com/%s/releases/download/v%s/install.sh | sh -s -- --version %s\n' \
              "$GITHUB_REPOSITORY" "$VERSION" "$VERSION"
            printf '```\n\nEach archive'"'"'s SHA-256 sum is in SHA256SUMS and beside it in a .sha256 file.\n'
          } >> "$RUNNER_TEMP/notes.md"
          cp "$RUNNER_TEMP/notes.md" dist/RELEASE_NOTES.md
          ls -l dist
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-${{ steps.version.outputs.version }}
          path: dist/
          if-no-files-found: error
          overwrite: true
      - name: Publish the GitHub release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          PRERELEASE: ${{ steps.version.outputs.prerelease }}
        run: |
          files="dist/graphicle-*.tar.gz dist/graphicle-*.tar.gz.sha256 dist/SHA256SUMS dist/install.sh dist/graphicle.rb"
          flags=""
          if [ "$PRERELEASE" = true ]; then flags="--prerelease"; fi
          # gh uploads the files to a draft and publishes it once all are there.
          # shellcheck disable=SC2086
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            # A re-run: replace the files, and publish a draft an earlier attempt left.
            gh release upload "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --clobber $files
            gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft=false
          else
            gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag $flags \
              --title "Graphicle $VERSION" --notes-file dist/RELEASE_NOTES.md $files
          fi

  homebrew-tap:
    # Final releases only. Needs the HOMEBREW_TAP_TOKEN secret: a fine-grained
    # token with contents read and write on graphicle-ai/homebrew-tap. Without
    # it, copy graphicle.rb from the release to the tap's Formula/ by hand.
    needs: release
    if: github.ref_type == 'tag' && needs.release.outputs.prerelease == 'false'
    runs-on: ubuntu-latest
    env:
      TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
      VERSION: ${{ needs.release.outputs.version }}
    steps:
      - name: Token
        id: token
        run: |
          if [ -n "$TAP_TOKEN" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::HOMEBREW_TAP_TOKEN is not set: copy graphicle.rb from the v$VERSION release to graphicle-ai/homebrew-tap/Formula/graphicle.rb"
          fi
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: steps.token.outputs.present == 'true'
        with:
          name: release-${{ needs.release.outputs.version }}
          path: dist
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        if: steps.token.outputs.present == 'true'
        with:
          repository: graphicle-ai/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: tap
      - name: Update the formula
        if: steps.token.outputs.present == 'true'
        working-directory: tap
        run: |
          mkdir -p Formula
          cp ../dist/graphicle.rb Formula/graphicle.rb
          git add Formula/graphicle.rb
          if git diff --cached --quiet; then echo "The tap already has graphicle $VERSION"; exit 0; fi
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -m "graphicle $VERSION"
          git push origin HEAD
