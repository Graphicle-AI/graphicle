# Continuous integration for Graphicle Core. Each crate under crates/ is its
# own Cargo workspace with its own lockfile: crates/graphicle (the graphicle
# program), crates/graphicle-graph (the graph engine and its graphicle-graph
# program) and crates/graphicle-memory (the memory library). Each is
# formatted, linted and tested on macOS (Apple silicon) and Linux (x86-64), in
# its own job: the three build folders together would not fit a runner's disk.
# The windows job builds, lints and tests each crate on Windows (x86-64,
# preview); that job says which crates' tests gate.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  # The toolchain releases are built and tested with. The crates declare
  # rust-version 1.94.1, which the msrv job checks.
  RUST_TOOLCHAIN: "1.95.0"

jobs:
  core:
    name: ${{ matrix.crate }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, ubuntu-latest]
        crate: [graphicle, graphicle-graph, graphicle-memory]
        include:
          - crate: graphicle
            dir: crates/graphicle
          # The engine with its opt-in features too (postgres, bedrock,
          # transcription), so that they stay built, linted and tested.
          - crate: graphicle-graph
            dir: crates/graphicle-graph
            fmt: --package graphicle --package graphicle-graph
            features: --features postgres,bedrock,transcription
          - crate: graphicle-memory
            dir: crates/graphicle-memory
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Toolchain
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component rustfmt,clippy
          rustup default "$RUST_TOOLCHAIN"
      # The memory library (and the graphicle program through it) compiles its
      # grammars from the checksum-pinned parser sources in .tslp-root; see
      # crates/graphicle/.cargo/config.toml. The engine does not use them.
      - name: zstd (unpacks the parser sources)
        if: matrix.crate != 'graphicle-graph'
        run: |
          if ! command -v zstd >/dev/null; then
            if [ "$RUNNER_OS" = macOS ]; then brew install zstd; else sudo apt-get update && sudo apt-get install -y zstd; fi
          fi
      - name: Cache parser sources
        if: matrix.crate != 'graphicle-graph'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .tslp-root
          key: parser-sources-${{ runner.os }}-${{ hashFiles('crates/graphicle/tools/prepare_parser_sources.py', 'crates/graphicle/.cargo/config.toml', 'crates/graphicle-memory/.cargo/config.toml') }}
      - name: Prepare parser sources (verifies a restored folder)
        if: matrix.crate != 'graphicle-graph'
        run: python3 crates/graphicle/tools/prepare_parser_sources.py
      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: ${{ matrix.dir }}
          key: ${{ matrix.crate }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Format
        working-directory: ${{ matrix.dir }}
        run: cargo fmt ${{ matrix.fmt }} --check
      - name: Clippy
        working-directory: ${{ matrix.dir }}
        run: cargo clippy --locked --all-targets ${{ matrix.features }} -- -D warnings
      - name: Clippy with local inference
        if: matrix.crate == 'graphicle'
        working-directory: crates/graphicle
        run: cargo clippy --locked --all-targets --features local-inference -- -D warnings
      - name: Tests
        working-directory: ${{ matrix.dir }}
        run: cargo test --locked --all-targets ${{ matrix.features }}

  windows:
    # Windows (preview): each crate in its own job, so each has its own target
    # folder (one shared folder breaks graphicle-memory's test build), with the
    # default features. Building and Clippy gate. The tests gate only for a
    # crate whose entry sets gate_tests: true; for the others a failure is
    # reported as a warning. Set it crate by crate once its tests pass on
    # Windows. Formatting is checked once, by the core job.
    name: ${{ matrix.crate }} (windows-2022)
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        include:
          - crate: graphicle
            dir: crates/graphicle
            gate_tests: false
          - crate: graphicle-graph
            dir: crates/graphicle-graph
            gate_tests: false
          - crate: graphicle-memory
            dir: crates/graphicle-memory
            gate_tests: false
    defaults:
      run:
        shell: bash
    steps:
      # Long paths for deep fixtures. Line endings need no setting: the
      # repository's .gitattributes checks text files out with LF on every
      # system, so this job sees what a clone with Git's defaults gets.
      - name: Git settings
        run: git config --global core.longpaths true
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Toolchain
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component clippy
          rustup default "$RUST_TOOLCHAIN"
      # Python 3.14 unpacks the parser sources itself (compression.zstd).
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.14"
      - name: Packaging checks
        if: matrix.crate == 'graphicle-graph'
        run: python packaging/test_release_build.py
      - name: Cache parser sources
        if: matrix.crate != 'graphicle-graph'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .tslp-root
          key: parser-sources-${{ runner.os }}-${{ hashFiles('crates/graphicle/tools/prepare_parser_sources.py', 'crates/graphicle/.cargo/config.toml', 'crates/graphicle-memory/.cargo/config.toml') }}
      - name: Prepare parser sources (verifies a restored folder)
        if: matrix.crate != 'graphicle-graph'
        run: python crates/graphicle/tools/prepare_parser_sources.py
      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: ${{ matrix.dir }}
          key: windows-${{ matrix.crate }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Build
        working-directory: ${{ matrix.dir }}
        run: cargo build --locked --all-targets
      - name: Clippy
        working-directory: ${{ matrix.dir }}
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Tests
        id: tests
        continue-on-error: ${{ !matrix.gate_tests }}
        working-directory: ${{ matrix.dir }}
        run: cargo test --locked --all-targets --no-fail-fast
      - name: Report failing tests (not gating)
        if: steps.tests.outcome == 'failure' && !matrix.gate_tests
        env:
          CRATE: ${{ matrix.crate }}
        run: echo "::warning title=Windows tests::$CRATE has failing tests on Windows (not gating yet); see the Tests step"
      # The HTTPS clients trust the Windows certificate store: the test adds
      # its own certificate authority to Cert:\LocalMachine\Root, connects
      # without SSL_CERT_FILE and removes the authority again. Not gating yet.
      - name: Windows certificate store
        id: root_store
        if: matrix.crate == 'graphicle-graph'
        continue-on-error: true
        working-directory: ${{ matrix.dir }}
        env:
          GRAPHICLE_TEST_ROOT_STORE: windows
        run: cargo test --locked --test tls_roots
      - name: Report the certificate store test (not gating)
        if: steps.root_store.outcome == 'failure'
        run: echo "::warning title=Windows certificate store::the tls_roots test failed; see the Windows certificate store step"

  licences:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Toolchain
        run: rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal && rustup default "$RUST_TOOLCHAIN"
      - name: cargo-deny and cargo-about
        # cargo-about 0.9 builds its program only with the cli feature.
        run: |
          cargo install --locked cargo-deny@0.20.2
          cargo install --locked --features cli cargo-about@0.9.2
      - name: Engine dependencies (licences, advisories, sources)
        working-directory: crates/graphicle-graph
        run: cargo deny check
      - name: Memory library and program dependency licences
        run: |
          (cd crates/graphicle-memory && cargo deny check licenses)
          (cd crates/graphicle && cargo deny check licenses)
      - name: Adapted-file headers
        working-directory: crates/graphicle-graph
        run: python3 tools/mark_adapted_files.py --check
      # The review action's scripts, with stand-ins for curl, graphicle and gh.
      - name: Review action
        run: python3 packaging/github-action/test_action.py
      # The committed pages the release archives ship (CONTRIBUTING.md,
      # Dependencies): regenerated from the locks, they must not change.
      - name: Third-party licence pages are current
        run: |
          (cd crates/graphicle-graph && cargo fetch --locked && cargo about generate --frozen --fail --all-features about.hbs -o licenses/THIRD_PARTY_LICENSES.html)
          (cd crates/graphicle && cargo fetch --locked && cargo about generate --frozen --fail --all-features about.hbs -o THIRD_PARTY_LICENSES.html)
          git diff --exit-code -- crates/graphicle-graph/licenses/THIRD_PARTY_LICENSES.html crates/graphicle/THIRD_PARTY_LICENSES.html

  msrv:
    # Reported, not gating: the crates declare rust-version 1.94.1.
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Toolchain
        run: rustup toolchain install 1.94.1 --profile minimal && rustup default 1.94.1
      - name: Parser sources
        run: python3 crates/graphicle/tools/prepare_parser_sources.py
      - name: Engine
        working-directory: crates/graphicle-graph
        run: cargo check --locked --all-targets
      - name: Memory library
        working-directory: crates/graphicle-memory
        run: cargo check --locked --all-targets
      - name: Program
        working-directory: crates/graphicle
        run: cargo check --locked --all-targets
