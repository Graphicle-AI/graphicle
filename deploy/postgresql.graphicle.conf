# PostgreSQL settings for Graphicle's store on one 12 GB, 6-core host that
# also runs Graphicle itself (two `serve` instances and an indexer).
# Include from postgresql.conf:  include = 'postgresql.graphicle.conf'
# Sizes are for 12 GB of memory; scale shared_buffers and
# effective_cache_size with the host.

# Connections: two instances at GRAPHICLE_DATABASE_POOL=32 each, an indexer
# and administration.
max_connections = 120

# Memory: about a quarter of the host for the buffer cache; the rest stays
# with the operating system's page cache and the Graphicle processes.
shared_buffers = 3GB
effective_cache_size = 7GB
work_mem = 16MB
maintenance_work_mem = 512MB
huge_pages = try

# Write-ahead log. PostgreSQL recycles its log at checkpoints whatever
# readers are doing (readers never pin it, unlike SQLite's WAL), so its size
# is bounded by max_wal_size.
wal_compression = on
max_wal_size = 4GB
min_wal_size = 512MB
checkpoint_completion_target = 0.9
wal_buffers = 64MB

# Storage: an SSD or NVMe volume. For a network volume or a disk, raise
# random_page_cost to 2-4 and lower effective_io_concurrency.
random_page_cost = 1.1
effective_io_concurrency = 200
maintenance_io_concurrency = 200

# Parallelism on 6 cores, most of them Graphicle's.
max_worker_processes = 6
max_parallel_workers = 4
max_parallel_workers_per_gather = 2
max_parallel_maintenance_workers = 2

# Graphicle's tables take many updates (job leases, cleanup) and large
# inserts (graph projections): vacuum and analyze them earlier than the
# defaults.
autovacuum_vacuum_scale_factor = 0.05
autovacuum_analyze_scale_factor = 0.02
autovacuum_vacuum_insert_scale_factor = 0.05
autovacuum_max_workers = 3

# A transaction left open holds back vacuum for every table: end one that
# idles for 10 minutes (Graphicle's never idle inside a transaction).
idle_in_transaction_session_timeout = '10min'

# What the gate's watchdog reads.
log_checkpoints = on
log_autovacuum_min_duration = '10s'
log_lock_waits = on
track_io_timing = on
