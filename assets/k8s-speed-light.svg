<svg xmlns="http://www.w3.org/2000/svg" width="860" height="390" viewBox="0 0 860 390" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" role="img" aria-label="Kubernetes v1.37.1 code-only graph. First build: Graphicle 0.1.17 3 min 20 s, Graphify 0.9.108 33 min 11 s. Update after one commit, median over the same 4 commits: Graphicle 4 min 30 s, Graphify 27 min 54 s. Update with nothing changed: Graphicle 21 s, Graphify 8 min 48 s."><text x="0" y="20" font-size="15" font-weight="600" fill="#1f2328">Kubernetes v1.37.1, code-only graph (shorter is faster)</text><text x="0" y="52" font-size="13" font-weight="600" fill="#1f2328">First build of Kubernetes</text><text x="180" y="78" font-size="13" text-anchor="end" fill="#1f2328">Graphicle 0.1.17</text><rect x="190" y="60" width="550" height="26" rx="3" fill="#eaeef2"/><rect x="190" y="60" width="55" height="26" rx="3" fill="#5B4BDB"/><text x="253" y="78" font-size="13" font-weight="600" fill="#1f2328">3 min 20 s</text><text x="180" y="114" font-size="13" text-anchor="end" fill="#1f2328">Graphify 0.9.108</text><rect x="190" y="96" width="550" height="26" rx="3" fill="#eaeef2"/><rect x="190" y="96" width="550" height="26" rx="3" fill="#8c959f"/><text x="748" y="114" font-size="13" font-weight="600" fill="#1f2328">33 min 11 s</text><text x="0" y="156" font-size="13" font-weight="600" fill="#1f2328">Update after one commit</text><text x="180" y="182" font-size="13" text-anchor="end" fill="#1f2328">Graphicle 0.1.17</text><rect x="190" y="164" width="550" height="26" rx="3" fill="#eaeef2"/><rect x="190" y="164" width="74" height="26" rx="3" fill="#5B4BDB"/><text x="272" y="182" font-size="13" font-weight="600" fill="#1f2328">4 min 30 s</text><text x="180" y="218" font-size="13" text-anchor="end" fill="#1f2328">Graphify 0.9.108</text><rect x="190" y="200" width="550" height="26" rx="3" fill="#eaeef2"/><rect x="190" y="200" width="462" height="26" rx="3" fill="#8c959f"/><text x="660" y="218" font-