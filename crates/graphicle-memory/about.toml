# cargo-about configuration (cargo-about 0.9.x).
# Mirrors the allow list in deny.toml. Run:
#   cargo about generate about.hbs -o <output>.html
accepted = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unlicense",
    "Zlib",
    "MPL-2.0",
    "Unicode-DFS-2016",
    "Unicode-3.0",
    "CC0-1.0",
]
# First-party path crates are audited in RIGHTS_AUDIT.md, not here.
private = { ignore = true }
workarounds = ["ring", "rustls", "prost", "tonic", "chrono"]

# Per-crate additions mirroring the deny.toml exceptions (RIGHTS_AUDIT.md F1).
[webpki-roots]
accepted = ["CDLA-Permissive-2.0"]

[webpki-root-certs]
accepted = ["CDLA-Permissive-2.0"]
