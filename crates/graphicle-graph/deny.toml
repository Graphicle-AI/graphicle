# cargo-deny configuration (cargo-deny >= 0.18; written against 0.20.2).
# Licensing policy: anything not on the allow list is rejected; there is no
# separate deny list in cargo-deny v2 config.
#
# Run: cargo deny check licenses bans sources advisories

[graph]
all-features = true

[output]
feature-depth = 1

[licenses]
# The project's allow list (+ Unicode-3.0 and CC0-1.0 which appear in the
# Rust ecosystem and were approved for the gate). OpenSSL and BSL-1.0 are
# intentionally NOT allowed so that they surface as findings if present.
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unlicense",
    "Zlib",
    "MPL-2.0",
    "Unicode-DFS-2016",
    "Unicode-3.0",
    "CC0-1.0",
]
confidence-threshold = 0.8
# The allow list is shared policy across crates; entries this crate does not
# use are not findings.
unused-allowed-license = "allow"
# Narrow, per-crate exceptions for permissive licences outside the list
# (research/licensing-audit-2026-09-26/RIGHTS_AUDIT.md F1): the Mozilla CA
# bundle data in webpki-roots, and libpq, compiled only by the optional
# `postgres` feature. Both are OSI/permissive and attribution is retained.
exceptions = [
    { allow = ["CDLA-Permissive-2.0"], crate = "webpki-roots" },
    { allow = ["PostgreSQL"], crate = "pq-src" },
]
# Path/workspace crates that are not published are first-party and are
# audited separately (RIGHTS_AUDIT.md); do not gate them here.
private = { ignore = true }

[bans]
multiple-versions = "warn"
wildcards = "allow"
highlight = "all"
workspace-default-features = "allow"
external-default-features = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []

[advisories]
db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/rustsec/advisory-db"]
yanked = "warn"
# Every vulnerability and unsoundness advisory is fixed (legacy AWS TLS client
# removed, lru >= 0.18.2), except three in zip 8's extraction to disk, which
# nothing here calls: the engine, the program and calamine open an archive and
# read its members in memory. zip 9 fixes them, but calamine 0.36.1, the latest
# release, requires zip ^8.6 (its main branch already uses zip 9.0, unreleased).
# Remove these three ignores, and move to zip 9, when calamine releases with it.
# Also ignored: three advisories in zstd 0.13.3 and zstd-safe 7.3.0, which only
# jieba-rs 0.11.0 (Chinese word splitting) brings in, through include-flate 0.3.4
# (zstd ^0.13.3). Both are their latest releases; the fixes are in zstd 0.14.3
# and zstd-safe 8.2.0. include-flate only unpacks jieba-rs's own dictionaries,
# built into the program, each with a new zstd::stream::read::Decoder. Remove
# these three when jieba-rs or include-flate moves to zstd 0.14.3 or later.
# The other entries are "unmaintained" notices for transitive crates with no
# known vulnerability and no maintained drop-in:
ignore = [
    { id = "RUSTSEC-2026-0367", reason = "zip 8.6.0 (engine, program, calamine): SUID/SGID bits kept by ZipArchive::extract; archives are only read in memory, never extracted" },
    { id = "RUSTSEC-2026-0368", reason = "zip 8.6.0 (engine, program, calamine): symbolic links created by ZipArchive::extract; archives are only read in memory, never extracted" },
    { id = "RUSTSEC-2026-0369", reason = "zip 8.6.0 (engine, program, calamine): permissions applied through symbolic links by extract(); archives are only read in memory, never extracted" },
    { id = "RUSTSEC-2026-0391", reason = "zstd 0.13.3 via jieba-rs -> include-flate: affects the stream with_context constructors, which include-flate never calls (a new decoder per dictionary)" },
    { id = "RUSTSEC-2026-0398", reason = "zstd-safe 7.3.0 via jieba-rs -> include-flate: affects Seekable::decompress, which needs the seekable feature; it is off" },
    { id = "RUSTSEC-2026-0403", reason = "zstd-safe 7.3.0 via jieba-rs -> include-flate: affects stream::write::Decoder; include-flate reads with stream::read::Decoder, which the advisory lists as not affected" },
    { id = "RUSTSEC-2026-0418", reason = "libz-sys 1.1.29 via flate2: its build script prints the whole build environment only when built with cc 1.6.0 or later; Cargo.lock pins cc 1.4.7. Remove when the lock moves to libz-sys 1.1.31 or later" },
    { id = "RUSTSEC-2024-0436", reason = "paste (proc-macro, build time only) via neo4rs -> nav-types -> nalgebra -> simba" },
    { id = "RUSTSEC-2026-0192", reason = "ttf-parser via pdf-extract -> lopdf; font tables are parsed only from local PDFs" },
    { id = "RUSTSEC-2025-0075", reason = "unic-char-range via rustpython-parser (Python literal parsing); no vulnerability" },
    { id = "RUSTSEC-2025-0080", reason = "unic-common via rustpython-parser; no vulnerability" },
    { id = "RUSTSEC-2025-0081", reason = "unic-char-property via rustpython-parser; no vulnerability" },
    { id = "RUSTSEC-2025-0090", reason = "unic-emoji-char via rustpython-parser; no vulnerability" },
    { id = "RUSTSEC-2025-0098", reason = "unic-ucd-version via rustpython-parser; no vulnerability" },
    { id = "RUSTSEC-2025-0100", reason = "unic-ucd-ident via rustpython-parser; no vulnerability" },
]
