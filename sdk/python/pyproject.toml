[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
# The PyPI name "graphicle" belongs to an unrelated project; the import package is graphicle_sdk.
name = "graphicle-sdk"
version = "0.1.9"
description = "Python SDK for Graphicle, a local-first memory service that keeps original sources"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.10"
# Standard library only (urllib, json, subprocess).
dependencies = []
classifiers = [
    "Programming Language :: Python :: 3",
    "Typing :: Typed",
]

[tool.setuptools]
packages = ["graphicle_sdk"]

[tool.setuptools.package-data]
graphicle_sdk = ["py.typed"]
